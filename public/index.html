<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Screen Share — Host</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <main class="wrap">
    <h1>Share your screen</h1>
    <p class="sub">Click start, pick a screen/tab (check "Share audio" too), then send the link to your friend.</p>

    <button id="start-btn" class="btn">Start Sharing</button>

    <div id="link-panel" class="panel hidden">
      <p class="status" id="status-text">Waiting for your friend to open the link…</p>
      <div class="link-row">
        <input id="link-input" type="text" readonly />
        <button id="copy-btn" class="btn btn-small">Copy</button>
      </div>
    </div>

    <video id="preview" autoplay muted playsinline class="preview hidden"></video>

    <p id="error-text" class="error hidden"></p>
  </main>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="/bg3d.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/host.js"></script>
</body>
</html>
